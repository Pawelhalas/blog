name: Cadence

# At least one post every two weeks. More often is fine; every publish restarts
# the clock. This nags at due-2 and logs a miss at due, then goes quiet until the
# next window — daily nagging just trains you to filter it.
#
# "Last published" is derived from git history, not stored, so a post published
# by hand still restarts the clock. Needs fetch-depth: 0 for that.
#
# KNOWN HAZARD, verified 2026-08-24 against GitHub's docs: "In a public
# repository, scheduled workflows are automatically disabled when no repository
# activity has occurred in 60 days." This repo is public, so the nag can switch
# itself off during exactly the quiet stretch it exists to interrupt — and
# GitHub emails the owner when it does. Once WRITE_ENABLED is on this mostly
# self-heals: a logged miss commits to main every cadence period, which is
# repository activity. WRITE_ENABLED went on 2026-08-31 for exactly this
# reason — a miss lands every 14 days, well inside the 60-day window.

on:
  schedule:
    # Asked for 07:17 UTC. Do not read that as a delivery time.
    #
    # Measured 25-31 August 2026, this fired every single day but between 0.7
    # and 12.1 hours late, with gaps of 17.7 to 34.3 hours between runs. The
    # cadence logic is unaffected because its boundary is computed in UTC
    # calendar days, never in hours - but nothing here may assume the nag
    # arrives in the morning, because most days it does not.
    #
    # :17 rather than :00 because GitHub's docs name the top of every hour as a
    # high-load window. On this evidence it buys less than hoped.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only — do not open or update any issue"
        type: boolean
        default: true

# Both workflows commit .github/release-log.json to main, so they share one
# queue. Never cancel here: a cancelled write leaves the log half-updated, and
# unlike release.yml there is no pull request to notice it in.
concurrency:
  group: main-log-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  # On since 2026-08-31, after the notification-only phase ran clean (build plan
  # steps 3-4). The only thing it gates is writing a logged miss back to
  # .github/release-log.json.
  WRITE_ENABLED: "true"

jobs:
  check:
    name: Check publishing cadence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          # Full history: the cadence is derived from it.
          fetch-depth: 0
          # Writing the miss log pushes to main. Once main is protected that
          # needs the PAT (an admin's token bypasses protection, which is why
          # "do not allow bypassing" stays off). Falls back to the default token
          # so the notification-only phase works with no secrets configured.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: "🟢 Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "📦 Install automation dependencies"
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      - name: "🗓️ Check cadence"
        run: node .github/scripts/cadence.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          WRITE_ENABLED: ${{ env.WRITE_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
