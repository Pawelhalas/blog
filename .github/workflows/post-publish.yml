name: Post-publish

# Records published posts in .github/release-log.json once they are on main.
#
# The log is NOT where "last published" comes from — that is derived from git
# history every time, so a post published by hand still restarts the clock.
# What the log adds is the miss history and the hero-image background rotation,
# neither of which git knows about.
#
# The script reconciles the whole log against history rather than reading this
# push event, so it is idempotent and backfills anything published before the
# workflow existed.

on:
  push:
    branches:
      - main
    paths:
      - "src/content/posts/**"
  workflow_dispatch:

# Both workflows commit .github/release-log.json to main, so they share one
# queue. Never cancel here: a cancelled write leaves the log half-updated, and
# unlike release.yml there is no pull request to notice it in.
concurrency:
  group: main-log-write
  cancel-in-progress: false

permissions:
  contents: write

env:
  # On since 2026-08-31, same as cadence.yml. Build plan step 9. Until then the
  # log drifted: zbudowalem-z-claudem-tracker-ofert-pracy published 2026-08-27
  # and was never recorded.
  WRITE_ENABLED: "true"

jobs:
  record:
    name: Record in the release log
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          # Full history: the log is reconciled against every post-adding commit.
          fetch-depth: 0
          # Pushing the updated log to main needs a token that bypasses branch
          # protection. Falls back to the default token so this runs harmlessly
          # before the PAT exists.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: "🟢 Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "📦 Install automation dependencies"
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      - name: "📒 Update the release log"
        run: node .github/scripts/post-publish.mjs
        env:
          WRITE_ENABLED: ${{ env.WRITE_ENABLED }}
