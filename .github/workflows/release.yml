name: Release

# The per-post pipeline. Removing the underscore from a draft on a release/**
# branch is the publish signal — no confirmation prompt, no session that has to
# be open, no message to answer.
#
# The branch defines the scope: the target post is the un-prefixed file that
# exists here but not on main. Zero or two candidates fails loudly rather than
# guessing.

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute everything, write nothing, print the intended diff"
        type: boolean
        default: true
      generate_image:
        description: "Generate the hero image (costs money)"
        type: boolean
        default: true

# One run per branch. Cancelling the older one is safe because a run is
# resumable: whatever it committed before dying is picked up by the next, which
# then opens the pull request. Without that property this would strand branches.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Reading earlier runs of this workflow, to find a hero image already
  # previewed and approved for this branch.
  actions: read

env:
  # A push to release/** is a real run: it writes the metadata, commits, and
  # opens the pull request. Dropping the underscore is the publish signal, and
  # requiring a second manual dispatch after it was the one human step the
  # design said would not exist.
  #
  # The rehearsal this replaced no longer bought anything. It generated and paid
  # for the hero image anyway, and since metadata and image are cached per
  # branch the real run reuses exactly what the rehearsal produced — so the two
  # phases cost the same money and the second one only re-showed the first.
  # The pull request is the preview, it renders the image and the diff, and
  # branch protection means nothing reaches main until Pawel merges it.
  #
  # workflow_dispatch still defaults dry_run to true, so a deliberate rehearsal
  # is one checkbox away.
  DRY_RUN_DEFAULT: "false"
  # Roughly $0.02-$0.25 an image by tier. medium keeps the yearly cost in the
  # range the design budgeted for; high is noticeably better and ~4x the price.
  IMAGE_QUALITY: "medium"
  # On since autonomous publishing: nobody reads the diff before it is live, so
  # a reported typo would simply ship. What gets applied is only what
  # lib/orthography.mjs classifies as provably safe - missing diacritics, word
  # splits, case. A suggestion that would swap one real word for another is
  # reported and never applied, because that is a judgement about Pawel's
  # meaning rather than his spelling.
  APPLY_ORTHOGRAPHY: "true"

jobs:
  release:
    name: Prepare post for publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pipeline's own commits must not retrigger it. Matched on the subject
    # rather than the actor: the push now carries the PAT (see the checkout
    # step), so the actor is Pawel either way, and only the message tells the
    # two apart. Both subjects release.mjs can produce are listed here.
    #
    # A missed guard is not a loop: the second run finds nothing to commit and
    # stops without pushing. This makes it terminate on the first run instead.
    if: >-
      !startsWith(github.event.head_commit.message, 'Prepare ') &&
      !startsWith(github.event.head_commit.message, 'Regenerate the hero image')

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          # Full history: releaseCandidates() diffs this branch against main.
          fetch-depth: 0
          # The PAT, and it has to be.
          #
          # This checkout's credentials push the prepared commit back to the
          # branch. With the default token that push produced a `pull_request`
          # run stuck in `action_required` whenever the pull request already
          # existed - so a second preparation cycle, which is just an author
          # editing a post after the PR opened, left CI permanently unapproved.
          # Publishing then waits on checks that will never run.
          #
          # Rehearsal caught exactly that. The loop this token was avoiding is
          # prevented by the subject guard on the job instead, which is
          # deterministic where the token behaviour was not.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: "🟢 Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "📦 Install automation dependencies"
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      # The hero image is regenerated on every run, and gpt-image-1 is not
      # deterministic - so a dry run used to draw one picture, show it, and the
      # real run would then commit a different one. That made the preview worse
      # than useless: it looked like a checkpoint but decided nothing.
      #
      # So an image already previewed for this branch is pulled back in and
      # reused. [reimage] skips this deliberately; drawing something new is the
      # entire point of it.
      # Always pulled back. Which parts get used is decided in the script,
      # from the commit SUBJECT line only - see COMMIT_MESSAGE below.
      - name: "♻️ Reuse what was already generated for this branch"
        run: |
          set -uo pipefail
          for r in $(gh run list --workflow=release.yml --branch "$GITHUB_REF_NAME" \
                       --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            has=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts" \
                    --jq '.artifacts[] | select(.name=="hero-image-preview" and .expired==false) | .id' || true)
            if [ -n "$has" ]; then
              gh run download "$r" -n hero-image-preview -D dry-run-preview \
                && echo "Reusing the hero image previewed in run $r" && break
            fi
          done
          ls dry-run-preview/ 2>/dev/null || echo "No previewed image for this branch yet - one will be generated."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "🏗️ Run the release pipeline"
        run: node .github/scripts/release.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Passed through raw, not collapsed with `||` in an expression: a
          # false boolean input is falsy there, so `inputs.dry_run || 'true'`
          # would quietly force a dry run back on when you asked for a real one.
          # The script resolves input-over-default itself.
          DRY_RUN_DEFAULT: ${{ env.DRY_RUN_DEFAULT }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          GENERATE_IMAGE_INPUT: ${{ inputs.generate_image }}
          IMAGE_QUALITY: ${{ env.IMAGE_QUALITY }}
          APPLY_ORTHOGRAPHY: ${{ env.APPLY_ORTHOGRAPHY }}
          # The escape hatches are read from the commit SUBJECT line, in the
          # script, not matched against the whole message here.
          #
          # They used to be matched against the entire message, which meant a
          # commit that merely *mentioned* a marker fired it. That is not
          # hypothetical: the commit which introduced this comment explained
          # what the markers do, and thereby triggered one of them.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          # Needed so the script can raise an urgent issue when it publishes
          # something incomplete - a post going out with no hero image.
          GH_TOKEN: ${{ github.token }}
          WRITE_ENABLED: "true"

      # A dry run writes nothing, so the hero image it generated (and paid for)
      # would otherwise vanish with the runner. On a real run the image is
      # committed and renders in the PR's Files changed tab, so there is nothing
      # to upload and this step finds no files.
      - name: "🖼️ Upload the dry-run hero image for review"
        if: hashFiles('dry-run-preview/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hero-image-preview
          path: dry-run-preview/
          retention-days: 14

      - name: "🏷️ Ensure PR labels exist"
        if: hashFiles('pr-title.txt') != ''
        run: |
          gh label create needs-image --color FBCA04 \
            --description "Published without a hero image - add one before merging" --force
          gh label create automated-release --color 0E8A16 \
            --description "Opened by release.yml and eligible for automatic publishing" --force
          gh label create hold --color 5319E7 \
            --description "Do not publish automatically" --force
          gh label create urgent --color B60205 \
            --description "Automation needs Pawel: publishing is blocked or shipped incomplete" --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "🔀 Open or update the pull request"
        if: hashFiles('pr-title.txt') != ''
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          labels="$(cat pr-labels.txt)"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --title "$(cat pr-title.txt)" --body-file pr-body.md
            echo "Updated the existing pull request for $branch."
          else
            gh pr create --base main --head "$branch" \
              --title "$(cat pr-title.txt)" --body-file pr-body.md
            echo "Opened a pull request for $branch."
          fi

          if [ -n "$labels" ]; then
            gh pr edit "$branch" --add-label "$labels"
          fi
        env:
          # The PAT, not github.token. GitHub's docs: "events triggered by the
          # GITHUB_TOKEN will not create a new workflow run" — a PR opened with
          # the default token would skip ci.yml entirely and publish something
          # that was never type-checked.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
